  <div  id="app">
    <div class="login">

      <div class="text">聊天</div>
      <div class="args">
        <span>账号</span>
        <input type="text" v-model="accInput" style="display: inline-block; height: 30px; width: 250px;">
      </div>
      <div class="args">
        <span>密码</span>
        <input type="password" v-model="pwdInput" style="display: inline-block; height: 30px; width: 250px;">
      </div>

      <div class="perbtn">
        <div class="btn" @click="login()">登录</div>
        <div class="btn" @click="handleCreate()">注册</div>
      </div>
    </div>

    <div class="add-form">
      <el-dialog title="账号注册" :visible.sync="dialogFormVisible">
        <el-form ref="dataAddForm" :model="formData" label-position="right" label-width="100px">

          <el-row>

              <el-col :span="12">

                  <el-form-item label="账号" prop="accountNum">

                      <el-input v-model="formData.accountNum"/>

                  </el-form-item>

              </el-col>
              <el-col :span="12">

                  <el-form-item label="密码" prop="password">

                      <el-input v-model="formData.password"/>

                  </el-form-item>

              </el-col>

              <el-col :span="12">

                  <el-form-item label="用户名" prop="username">

                      <el-input v-model="formData.username"/>

                  </el-form-item>

              </el-col>
              <el-col :span="12">

                  <el-form-item label="其他" prop="others">

                      <el-input v-model="formData.others"/>

                  </el-form-item>

              </el-col>

          </el-row>

        </el-form>

        <div slot="footer" class="dialog-footer">

            <el-button @click="cancel()">取消</el-button>

            <el-button type="primary" @click="handleAdd()">确定</el-button>

        </div>
      </el-dialog>
    </div>

  </div>

  <script src="js/vue.js"></script>
  <script src="plugins/elementui/index.js"></script>
  <script type="text/javascript" src="js/jquery.min.js"></script>
  <script src="js/axios-0.18.0.js"></script>
