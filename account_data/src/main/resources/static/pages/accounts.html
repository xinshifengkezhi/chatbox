<!DOCTYPE html><html><head>    <!-- 页面meta -->    <meta charset="utf-8">    <meta http-equiv="X-UA-Compatible" content="IE=edge">    <title>用户账号中心</title>    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">    <!-- 引入样式 -->    <link rel="stylesheet" href="../plugins/elementui/index.css">    <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">    <link rel="stylesheet" href="../css/style.css"></head><body class="hold-transition"><div id="app">    <div class="content-header">        <h1>账号列表</h1>    </div>    <div class="app-container">        <div class="box">            <div class="filter-container">                <el-input placeholder="账号id" v-model="pagination.id" style="width: 200px;" class="filter-item"></el-input>                <el-input placeholder="账号" v-model="pagination.num" style="width: 200px;" class="filter-item"></el-input>                <el-input placeholder="用户名" v-model="pagination.name" style="width: 200px;" class="filter-item"></el-input>                <el-button @click="getAll()" class="dalfBut">查询</el-button>                <el-button type="primary" class="butT" @click="handleCreate()">新建</el-button>            </div>            <el-table size="small" current-row-key="id" :data="dataList" stripe highlight-current-row>                <el-table-column prop="id" align="center" label="序号"></el-table-column>                <el-table-column prop="accountNum" label="账号" align="center"></el-table-column>                <el-table-column prop="password" label="密码" align="center"></el-table-column>                <el-table-column prop="username" label="用户名" align="center"></el-table-column>                <el-table-column prop="others" label="其他" align="center"></el-table-column>                <el-table-column label="操作" align="center">                    <template slot-scope="scope">                        <el-button type="primary" size="mini" @click="handleUpdate(scope.row)">编辑</el-button>                        <el-button type="danger" size="mini" @click="handleDelete(scope.row)">删除</el-button>                    </template>                </el-table-column>            </el-table>            <!--分页组件-->            <div class="pagination-container">                <el-pagination                        class="pagiantion"                        @current-change="handleCurrentChange"                        :current-page="pagination.currentPage"                        :page-size="pagination.pageSize"                        layout="total, prev, pager, next, jumper"                        :total="pagination.total">                </el-pagination>            </div>            <!-- 新增标签弹层 -->            <div class="add-form">                <el-dialog title="新增账号" :visible.sync="dialogFormVisible">                    <el-form ref="dataAddForm" :model="formData" :rules="rules" label-position="right" label-width="100px">                        <el-row>                            <el-col :span="12">                                <el-form-item label="账号" prop="accountNum">                                    <el-input v-model="formData.accountNum"/>                                </el-form-item>                            </el-col>                            <el-col :span="12">                                <el-form-item label="密码" prop="password">                                    <el-input v-model="formData.password"/>                                </el-form-item>                            </el-col>                            <el-col :span="12">                                <el-form-item label="用户名" prop="username">                                    <el-input v-model="formData.username"/>                                </el-form-item>                            </el-col>                            <el-col :span="12">                                <el-form-item label="其他" prop="others">                                    <el-input v-model="formData.others"/>                                </el-form-item>                            </el-col>                        </el-row>                    </el-form>                    <div slot="footer" class="dialog-footer">                        <el-button @click="cancel()">取消</el-button>                        <el-button type="primary" @click="handleAdd()">确定</el-button>                    </div>                </el-dialog>            </div>            <!-- 编辑标签弹层 -->            <div class="add-form">                <el-dialog title="编辑检查项" :visible.sync="dialogFormVisible4Edit">                    <el-form ref="dataEditForm" :model="formData" :rules="rules" label-position="right" label-width="100px">                        <el-row>                            <el-col :span="12">                                <el-form-item label="账号" prop="accountNum">                                    <el-input v-model="formData.accountNum"/>                                </el-form-item>                            </el-col>                            <el-col :span="12">                                <el-form-item label="密码" prop="password">                                    <el-input v-model="formData.password"/>                                </el-form-item>                            </el-col>                            <el-col :span="12">                                <el-form-item label="用户名" prop="username">                                    <el-input v-model="formData.username"/>                                </el-form-item>                            </el-col>                            <el-col :span="12">                                <el-form-item label="其他" prop="others">                                    <el-input v-model="formData.others"/>                                </el-form-item>                            </el-col>                        </el-row>                    </el-form>                    <div slot="footer" class="dialog-footer">                        <el-button @click="cancel()">取消</el-button>                        <el-button type="primary" @click="handleEdit()">确定</el-button>                    </div>                </el-dialog>            </div>        </div>    </div></div></body><!-- 引入组件库 --><script src="../js/vue.js"></script><script src="../plugins/elementui/index.js"></script><script type="text/javascript" src="../js/jquery.min.js"></script><script src="../js/axios-0.18.0.js"></script><script>    //http://localhost:8080/pages/accounts.html    axios.defaults.baseURL = 'http://localhost:8080';    var vue = new Vue({        el: '#app',        data:{            dataList: [],//当前页要展示的列表数据            dialogFormVisible: false,//添加表单是否可见            dialogFormVisible4Edit:false,//编辑表单是否可见            formData: {},//表单数据            rules: {//校验规则                type: [{ required: true, message: 'id为必填项', trigger: 'blur' }],                name: [{ required: true, message: '账号为必填项', trigger: 'blur' }]            },            pagination: {//分页相关模型数据                currentPage: 1,//当前页码                pageSize:5,//每页显示的记录数                total:0,//总记录数                id:0,                num:"",                name:""            }        },        //钩子函数，VUE对象初始化完成后自动执行        created() {            this.getAll();        },        methods: {            //列表            getAll() {                param = "?id="+this.pagination.id;                param += "&accountNum="+this.pagination.num;                param += "&username="+this.pagination.name;                //发送异步请求                axios.get("/Accounts/page/"+this.pagination.currentPage                    +"/"+this.pagination.pageSize + param).then((res)=>{                    this.pagination.pageSize = res.data.data.size;                    this.pagination.currentPage = res.data.data.current;                    this.pagination.total = res.data.data.total;                    this.dataList = res.data.data.records;                });            },            //切换页码            handleCurrentChange(currentPage) {                this.pagination.currentPage = currentPage;                this.getAll();            },            //弹出添加窗口            handleCreate() {                this.dialogFormVisible = true;                this.resetForm();            },            //重置表单            resetForm() {                this.formData = {};            },            //添加            handleAdd () {                axios.post("/Accounts",this.formData).then((res)=>{                    if(res.data.flag) {                        this.dialogFormVisible = false;                        this.$message.success("添加成功")                        this.getAll();                    }else{                        this.$message.error(res.data.msg)                    }                }).catch((error)=>{                    if (error.response && error.response.status === 500) {                        const errorMsg = error.response.data?.message || error.message;                        if (errorMsg.includes("Duplicate entry") || errorMsg.includes("accountNum")) {                            this.$message.error("账号号码已存在，请使用其他账号");                        } else {                            this.$message.error("添加失败：账号号码已存在" + errorMsg);                        }                    } else {                        this.$message.error("网络错误，请稍后重试");                    }                });            },            //取消            cancel(){                this.dialogFormVisible = false;                this.resetForm();            },            // 删除            handleDelete(row) {                this.$confirm("此操作会永久删除当前信息，是否继续？","警告",{type:"info"}).then(()=>{                    axios.delete("/Accounts/" + row.id).then((res) => {                        if (res.data.flag) {                            this.$message.success("删除成功")                            this.getAll();                        } else {                            this.$message.error("该数据已经删除")                        }                    });                }).catch(()=>{                    this.$message.error("小心别误触了")                });            },            //弹出编辑窗口            handleUpdate(row) {                axios.get("/Accounts/"+row.id).then((res)=>{                    if (res.data.flag && res.data.data != null) {                        console.log("完整响应:", res);                        console.log("res.data:", res.data);                        console.log("res.data.flag:", res.data.flag);                        console.log("res.data.data:", res.data.data);                        this.dialogFormVisible4Edit = true;                        this.formData = res.data.data;                    } else {                        this.$message.error("不存在的数据");                        this.getAll();                    }                });            },            //修改            handleEdit() {                axios.put("/Accounts",this.formData).then((res)=>{                    if(res.data.flag) {                        this.dialogFormVisible4Edit = false;                        this.$message.success("修改成功")                        this.getAll();                    }else{                        this.$message.error("修改失败")                    }                }).catch((error)=>{                    if (error.response && error.response.status === 500) {                        const errorMsg = error.response.data?.message || error.message;                        if (errorMsg.includes("Duplicate entry") || errorMsg.includes("accountNum")) {                            this.$message.error("账号号码已存在，请使用其他账号");                        } else {                            this.$message.error("修改失败：账号号码已存在" + errorMsg);                        }                    } else {                        this.$message.error("网络错误，请稍后重试");                    }                });            },            //条件查询        }    })</script></html>
