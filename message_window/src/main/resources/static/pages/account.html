<!DOCTYPE html><html><head>    <meta charset="utf-8">    <meta http-equiv="X-UA-Compatible" content="IE=edge">    <meta content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" name="viewport">    <link rel="stylesheet" href="../css/overall.css">    <link rel="stylesheet" href="../plugins/elementui/index.css">    <link rel="stylesheet" href="../plugins/font-awesome/css/font-awesome.min.css">    <link rel="stylesheet" href="../css/style.css"></head><body>    <div id="app" class="container">        <aside class="friends">            <div class="add-form">                <el-dialog title="账号查询" :visible.sync="searchFriend" @close="handleCloseSearchDialog">                    <el-form ref="dataAddForm" :model="searchIn" label-position="right" label-width="100px">                        <el-row>                            <el-col :span="20">                                <el-form-item label="账号" prop="accountNum">                                    <el-input v-model="searchIn.accountNum" placeholder="请输入账号">                                        <template slot="append">                                            <el-button type="primary" @click="searchUser">查询</el-button>                                        </template>                                    </el-input>                                </el-form-item>                            </el-col>                        </el-row>                        <el-row>                            <div class="tab-content">                                <div class="tab-header">                                    <el-table :show-header ="false" row-key="id" :data="addFriendList" style="font-size: 20px;"                                              stripe highlight-current-row>                                        <el-table-column prop="avatar" min-width="50"></el-table-column>                                        <el-table-column prop="accountNum" min-width="100"></el-table-column>                                        <el-table-column prop="name" label="" align="center" min-width="50"></el-table-column>                                        <el-table-column label="" align="center" width="100">                                            <template slot-scope="scope">                                                <el-button type="danger" style="font-size: 20px;" size="medium" @click="addFriends(scope.row)">添加</el-button>                                            </template>                                        </el-table-column>                                    </el-table>                                </div>                            </div>                        </el-row>                    </el-form>                </el-dialog>            </div>            <div class="add-form">                <el-dialog title="说点什么..." :visible.sync="request" @close="delHandleAdd">                    <el-form ref="dataAddForm" :model="requestIn" label-position="right" label-width="100px">                        <el-row>                            <el-col :span="20">                                <el-form-item prop="accountNum">                                    <el-input v-model="requestIn.message"/>                                </el-form-item>                            </el-col>                        </el-row>                    </el-form>                    <div slot="footer" class="dialog-footer">                        <el-button type="primary" @click="handleAdd()">发送</el-button>                    </div>                </el-dialog>            </div>            <div class="add-form">                <el-dialog title="" :visible.sync="settingWindow">                    <div class="btn" @click="alterUsername">修改昵称</div>                    <div class="axbtn" @click="deleteUser">注销</div>                </el-dialog>            </div>            <div class="add-form">                <el-dialog title="确定要注销吗?不可撤回哦..." :visible.sync="deleteWindow">                    <div class="axbtn" @click="affirmDelSelf">确定</div>                    <div class="btn" @click="cancelDelSelf">取消</div>                </el-dialog>            </div>            <div class="add-form">                <el-dialog title="确定要删除吗?不可撤回哦..." :visible.sync="delfriendWindow">                    <div class="axbtn" @click="deleteFrends">确定</div>                    <div class="btn" @click="cancelDelFriend">取消</div>                </el-dialog>            </div>            <div class="add-form">                <el-dialog title="" :visible.sync="alterWindow">                    <el-form ref="dataAddForm" :model="searchIn" label-position="right" label-width="100px">                        <el-row>                            <el-col :span="20">                                <el-form-item label="新昵称" prop="accountNum">                                    <el-input v-model="searchIn.username"/>                                </el-form-item>                                <div class="btn" @click="updataUsername">确认</div>                            </el-col>                        </el-row>                    </el-form>                </el-dialog>            </div>            <div class="custom-tab-header">                <el-tabs v-model="activeTab">                    <div class="perbtn" style="background: #fff">                        <div class="btn" @click="setting">个人设置</div>                    </div>                    <div class="perbtn" style="background: #fff">                        <div class="btn" @click="setFriendList">好友列表</div>                        <div class="btn" @click="setRequestList">好友申请</div>                    </div>                    <el-tab-pane name="friendList">                        <div class="friend-list-header">                            <div class="perbtn">                                <div class="btn" @click="findFriends">+添加好友</div>                                <div class="btn" @click="setDelete">{{ deleteButton ? '取消删除' : '-删除好友' }}</div>                            </div>                            <div class="args">                                <input type="text" placeholder="好友查询" v-model="accInput" @keyup.enter="chatFriends"                                       style="display: inline-block; height: 30px; width: 200px;">                            </div>                        </div>                        <div class="tab-content">                            <div class="tab-header">                                <el-table :show-header ="false" row-key="id" :data="friendList" ref="friendTable" style="font-size: 20px;"                                          stripe highlight-current-row @row-click="messageWindow">                                    <el-table-column class="avatar" min-width="50"></el-table-column>                                    <el-table-column prop="username" label="" align="center" min-width="150"></el-table-column>                                    <el-table-column label="" align="center" width="100">                                        <template slot-scope="scope">                                            <el-button type="danger" style="font-size: 20px;" v-if="deleteButton"                                                       size="medium" @click="delFriend(scope.row)">删除</el-button>                                        </template>                                    </el-table-column>                                </el-table>                            </div>                        </div>                    </el-tab-pane>                    <el-tab-pane name="friendRequest">                        <div class="request-header">                            <span class="request-title">待处理的好友申请</span><!--                            <el-button type="primary" size="small"--><!--                                       @click="refreshRequests" style="margin-left: 1px;">刷新</el-button>-->                        </div>                        <div class="request-table-wrapper">                            <el-table :show-header ="false" :data="requestList" stripe style="width: 100%;" empty-text="暂无好友申请">                                <el-table-column prop="applicantName" label="" min-width="60"></el-table-column>                                <el-table-column prop="time" label="" min-width="50"></el-table-column>                                <el-table-column prop="message" label="" min-width="50" show-overflow-tooltip></el-table-column>                                <el-table-column label="" align="center" width="180">                                    <template slot-scope="scope">                                        <el-button type="success" size="mini" @click="acceptRequest(scope.row)">接受</el-button>                                        <el-button type="danger" size="mini" @click="rejectRequest(scope.row)">拒绝</el-button>                                    </template>                                </el-table-column>                            </el-table>                        </div>                    </el-tab-pane>                </el-tabs>            </div>        </aside>        <main class="chat">            <div class="chat-header" v-if="currentFriend">                <i class="fa fa-arrow-left back-arrow" @click="backToEmpty"></i>                <div class="friend-info"><!--                    <span class="name">{{currentFriend.name}}</span>-->                    <span class="status">在线</span>                </div>            </div>            <div class="chat-header-placeholder" v-else>请选择一个好友开始聊天</div>            <div class="message-list" ref="messageList">                <div v-for="msg in currentMessages" :key="msg.id"                     class="message-item" :class="{self:msg.isSelf}">                    <div class="avatar">                        <img :src="msg.avatat" alt="" />                    </div>                    <div class="bubble">                        <div class="content">{{msg.content}}</div>                        <div class="time">{{msg.time}}</div>                    </div>                </div>            </div>            <div class="input-area">                <input type="text" v-model="inputMsg" placeholder="输入消息" @keyup.enter="sendMessage" />                <button @click="sendMessage">发送</button>            </div>        </main>    </div>    <script src="../js/vue.js"></script>    <script src="../plugins/elementui/index.js"></script>    <script type="text/javascript" src="../js/jquery.min.js"></script>    <script src="../js/axios-0.18.0.js"></script>    <script src="../js/getInfo.js"></script></body>
